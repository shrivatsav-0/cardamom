name: Build & Release Cardamom

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant to produce (all, github, or play)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - github
          - play
      play_track:
        description: 'Google Play release track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      play_status:
        description: 'Google Play release status'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - draft
          - inProgress
      upload_playstore:
        description: 'Upload Play Store AAB automatically'
        required: true
        default: true
        type: boolean
      publish_github:
        description: 'Publish release to GitHub Releases'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  validate-and-test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests (GitHub & Play flavors)
        run: ./gradlew testGithubDebugUnitTest testPlayDebugUnitTest --continue

  build-and-release:
    name: Build & Publish Artifacts
    needs: validate-and-test
    runs-on: ubuntu-latest
    env:
      BUILD_VARIANT: ${{ github.event.inputs.variant || 'all' }}
      PLAY_TRACK: ${{ github.event.inputs.play_track || 'internal' }}
      PLAY_STATUS: ${{ github.event.inputs.play_status || 'completed' }}
      UPLOAD_PLAY: ${{ github.event_name == 'push' || github.event.inputs.upload_playstore == 'true' }}
      PUBLISH_GH: ${{ github.event_name == 'push' || github.event.inputs.publish_github == 'true' }}
      PLAY_JSON_KEY_PRESENT: ${{ secrets.PLAY_STORE_JSON_KEY != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permissions
        run: |
          chmod +x gradlew
          chmod +x build_artifacts.sh

      - name: Configure Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/cardamom-release.jks
            cat <<EOF > app/keystore.properties
          storeFile=cardamom-release.jks
          storePassword=${KEYSTORE_PASSWORD:-}
          keyAlias=${KEY_ALIAS:-cardamom}
          keyPassword=${KEY_PASSWORD:-}
          EOF
            echo "Keystore successfully configured from GitHub Secrets."
          elif [ -f "app/keystore.properties" ]; then
            echo "Using existing repository keystore.properties."
          else
            echo "::warning ::No KEYSTORE_BASE64 secret provided. Builds may fail if release signing is enforced."
          fi

      - name: Build Artifacts via Build Script
        run: |
          ./build_artifacts.sh release --variant "$BUILD_VARIANT" --bump none --skip-tests

      - name: Stage Artifacts Info
        id: staging
        run: |
          VERSION=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Create GitHub Release (Split APKs & Checksums)
        if: ${{ env.PUBLISH_GH == 'true' && (env.BUILD_VARIANT == 'github' || env.BUILD_VARIANT == 'all') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.staging.outputs.version) }}
          name: Cardamom v${{ steps.staging.outputs.version }}
          body_path: dist/Release/v${{ steps.staging.outputs.version }}/github/github_release_notes.md
          draft: false
          prerelease: false
          files: |
            dist/Release/v${{ steps.staging.outputs.version }}/github/*.apk
            dist/Release/v${{ steps.staging.outputs.version }}/github/SHA256SUMS.txt
            dist/Release/v${{ steps.staging.outputs.version }}/github/update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Play Store Release Notes
        if: ${{ env.UPLOAD_PLAY == 'true' && (env.BUILD_VARIANT == 'play' || env.BUILD_VARIANT == 'all') }}
        run: |
          mkdir -p distribution/whatsnew
          # Default language en-US
          cp playstore_release_notes.txt distribution/whatsnew/whatsnew-en-US

      - name: Upload AAB to Google Play Store
        # NOTE: secrets.* cannot be used directly in `if:` — checked via job env.
        if: ${{ env.UPLOAD_PLAY == 'true' && (env.BUILD_VARIANT == 'play' || env.BUILD_VARIANT == 'all') && env.PLAY_JSON_KEY_PRESENT == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.shrivatsav.cardamom
          releaseFiles: dist/Release/v${{ steps.staging.outputs.version }}/play/Cardamom-v${{ steps.staging.outputs.version }}-play.aab
          track: ${{ env.PLAY_TRACK }}
          status: ${{ env.PLAY_STATUS }}
          whatsNewDirectory: distribution/whatsnew
